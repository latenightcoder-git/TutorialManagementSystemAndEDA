spring.application.name=TutorialManagementSystemAndEDA
server.port=8888

# All database information
spring.datasource.username=sa
spring.datasource.password=
# For temporary In-Memory Database Storage
spring.datasource.url=jdbc:h2:mem:madhu
spring.datasource.driverClassName=org.h2.Driver

# Keep db in HDD
# For permanent database Storage
#spring.datasource.url=jdbc:h2:D:\SPRING-PROJECTS\TutorialManagementSystemAndEDA\DB\mydb

# To see the database in browser
spring.h2.console.path=/h2
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# To see all queries in output
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Database management policies
# update: create once
# create: create every time of application up
# create-drop: create at the start of app and drop before end of app
spring.jpa.hibernate.ddl-auto=create
